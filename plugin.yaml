name: hermes-brief
version: "0.3.0"
manifest_version: 2
api_version: 1
description: >-
  Save pages, X posts and YouTube videos from Chrome and Hermes reads each one and writes you a short brief:
  what it is, the key points, why it matters, a next step, and timestamps for videos. Save with the extension's
  button, a right-click on any link, or by bookmarking into a Chrome folder named "Hermes". Briefs land in folders
  on a Desktop Briefs page, any chat can search them (brief_search), and brief_digest gives a daily "what you saved".
  Connect the extension with a 6-digit code from the Briefs page; no API key in the browser.
  Optional "What X says": one Grok x_search call per saved link (the host's own tool, so it uses the Grok sign-in of
  the API server's profile, or of the profile named in x_search_profile); off with what_x_says: false.
author: Bikash Joshi
license: MIT
homepage: https://github.com/BkashJEE/hermes-brief
tags: [browser, chrome-extension, bookmarks, read-later, summaries, youtube]
requires_hermes: ">=0.23.0"
capabilities: []
config_schema:
  what_x_says:
    type: bool
    default: true
    description: After each brief, ask Grok (Hermes's x_search tool) what people on X are saying about the link. Needs Grok access in Hermes; each lookup is one x_search call.
  x_search_profile:
    type: str
    default: ""
    description: Profile whose Grok sign-in x_search should use (for example ceo). Leave empty to use the profile that runs the API server.
provides_tools:
  - brief_save
  - brief_search
  - brief_get
  - brief_digest
